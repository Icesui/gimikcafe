<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management | Gimik Cafe</title>
    <link rel="icon" type="image" href="../Asset/Square Logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/admin-menu.css">
    <link rel="stylesheet" href="../css/admin-notifications.css">
</head>
<body>

<!-- HEADER -->
<header>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="../Asset/Logo clear.png" alt="Gimik Cafe Logo">
        </a>
        <div class="nav-links">
            <button type="button" class="admin-profile-button" id="adminProfileButton" title="Admin Profile">
                <i class="fa-regular fa-user"></i>
            </button>
            <button type="button" class="admin-sidebar-button logout-button" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </nav>
</header>

<!-- MAIN PAGE -->
<main class="admin-page">
    <aside class="admin-sidebar">

            <div class="sidebar-header-action">
                <button type="button" id="sidebarToggleBtn" class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
                <i class="fa-solid fa-chevron-left" id="sidebarToggleIcon"></i>
                </button>
            </div>

           <nav class="admin-navigation">
    <a href="/admin" class="admin-nav-link">
        <i class="fa-solid fa-chart-pie"></i>
        <span>Dashboard</span>
    </a>
    <a href="/admin/attendance" class="admin-nav-link">
        <i class="fa-solid fa-user-clock"></i>
        <span>Staff Attendance</span>
    </a>
    <a href="/admin/pos" class="admin-nav-link">
        <i class="fa-solid fa-cash-register"></i>
        <span>POS</span>
    </a>
    <a href="/admin/orders" class="admin-nav-link">
        <i class="fa-solid fa-receipt"></i>
        <span>Orders</span>
    </a>
    <a href="/admin/inventory" class="admin-nav-link">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span>Inventory</span>
    </a>
    <a href="/admin/menu" class="admin-nav-link active">
        <i class="fa-solid fa-mug-hot"></i>
        <span>Menu</span>
    </a>
    <a href="/admin/order-history" class="admin-nav-link">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Order History</span>
    </a>
    <a href="/admin/customers" class="admin-nav-link">
        <i class="fa-solid fa-users"></i>
        <span>Customers</span>
    </a>
    <a href="/" class="admin-nav-link">
        <i class="fa-solid fa-globe"></i>
        <span>View Website</span>
    </a>
</nav>
    </aside>

    <section class="admin-content menu-management">
        <div class="pos-header">
            <div>
                <h1>Menu Management</h1>
            </div>
            <div class="pos-date">
                <i class="fa-regular fa-calendar"></i>
                <span id="menuDateDisplay"></span>
            </div>
        </div>

        <div class="menu-controls">
            <div class="menu-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search products by name...">
            </div>
            <div class="menu-filter">
                <select id="categoryFilter">
                    <option value="All Categories" selected>All Categories</option>
                    <option value="Milk Tea">Milk Tea</option>
                    <option value="Ice Blended">Ice Blended</option>
                    <option value="Coffee">Coffee</option>
                    <option value="Non Coffee">Non Coffee</option>
                    <option value="Fruit Soda">Fruit Soda</option>
                    <option value="Snacks">Snacks</option>
                </select>
            </div>
        </div>

        <section class="menu-table-panel">
            <div class="menu-table-header">
                <div>
                    <h2>Products</h2>
                    <p id="menuCountSubtitle">0 products</p>
                </div>
                <div class="menu-header-actions">
                    <button type="button" class="menu-delete-btn" id="openDeleteProductBtn" title="Select a row then click to remove">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>Delete Product</span>
                    </button>
                    <button type="button" class="add-product-btn" id="openAddProductBtn">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add Product</span>
                    </button>
                </div>
            </div>

            <div class="menu-table-wrapper">
                <table class="menu-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </section>
</main>

<!-- PRODUCT DETAILS MODAL -->
<div class="product-modal">
    <div class="product-modal-overlay"></div>
    <div class="product-modal-box">
        <div class="product-modal-header">
            <div>
                <span class="menu-tag"></span>
                <h2 id="modalTitle">Product Details</h2>
            </div>
            <button type="button" class="modal-close" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="product-modal-body">
            <div class="product-image-section">
                <div class="large-product-image">
                    <img src="../Asset/Square Logo.jpg" alt="Product Image">
                </div>
                <button type="button" class="change-image-btn">
                    <i class="fa-solid fa-camera"></i> Change Image
                </button>
                <p class="image-help">
                    JPG<br>
                    800 × 800px
                </p>
            </div>

            <div class="product-form">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" placeholder="Enter product name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productCategory">Category</label>
                        <select id="productCategory">
                            <option value="Coffee">Coffee</option>
                            <option value="Milk Tea">Milk Tea</option>
                            <option value="Ice Blended">Ice Blended</option>
                            <option value="Non Coffee">Non Coffee</option>
                            <option value="Fruit Soda">Fruit Soda</option>
                            <option value="Snacks">Snacks</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productStatus">Availability</label>
                        <select id="productStatus">
                            <option value="Available" selected>Available</option>
                            <option value="Unavailable">Unavailable</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="tempOptionGroup">
                    <label for="productTemperature">Temperature / Type</label>
                    <select id="productTemperature">
                        <option value="both" selected>Both (Hot &amp; Iced)</option>
                        <option value="hot-only">Hot Only (16oz only)</option>
                        <option value="iced-only">Iced Only (16oz &amp; 22oz)</option>
                        <option value="none">Not Applicable (Food / Snacks)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productDescription">Description</label>
                    <textarea id="productDescription" rows="3" placeholder="Enter product description"></textarea>
                </div>

                <div class="form-group prices-group">
                    <div class="form-label-row">
                        <label>Sizes &amp; Prices</label>   
                    </div>
                    <div class="prices-list"></div>
                    <button type="button" class="add-price-btn">
                        <i class="fa-solid fa-plus"></i> Add Size &amp; Price
                    </button>
                </div>

                <div class="form-group ingredients-group">
                    <div class="form-label-row">
                        <label>Variant Recipes &amp; Ingredients</label>
                    </div>
                    <div class="variant-recipe-tabs" id="variantRecipeTabs"></div>
                    <div class="ingredients-list" id="variantIngredientsList"></div>
                    <button type="button" class="add-ingredient-btn" id="addVariantIngredientBtn">
                        <i class="fa-solid fa-plus"></i> Add Ingredient to this Size
                    </button>
                </div>
            </div>
        </div>

        <div class="product-modal-footer">
            <button type="button" class="cancel-product-btn">Cancel</button>
            <button type="button" class="save-product-btn">
                <i class="fa-solid fa-check"></i> Save Product
            </button>
        </div>
    </div>
</div>

<!-- DELETE PRODUCT MODAL -->
<div class="product-modal" id="deleteProductModal" style="display: none;">
    <div class="product-modal-overlay"></div>
    <div class="product-modal-box modal-box-sm">
        <div class="product-delete-content">
            <div class="delete-warning-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3>Delete Product?</h3>
            <p id="deleteModalPrompt">Are you sure you want to delete this product?</p>
            <div class="delete-modal-actions">
                <button type="button" class="modal-btn cancel" id="cancelDeleteBtn">Cancel</button>
                <button type="button" class="modal-btn danger-confirm" id="confirmDeleteBtn">
                    <i class="fa-solid fa-trash"></i> Yes, Delete
                </button>
            </div>
        </div>
    </div>
</div>

<script type="module" src="../js/admin.js"></script>
<script type="module" src="../js/admin-menu.js"></script>
<script type="module
