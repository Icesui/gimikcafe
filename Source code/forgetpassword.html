<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Gimik Cafe</title>
    <link rel="icon" type="image" href="Asset/Square Logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/forgetpassword.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page-body">

<!-- MAIN RESET CONTAINER -->
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <a href="index.html">
                <img src="Asset/Square Logo.jpg" alt="Gimik Cafe" class="auth-logo">
            </a>
            <h2>Reset Password</h2>
            <p>Enter the email address tied to your Gimik Cafe account, and we'll send you a password reset link.</p>
        </div>
        <div id="resetAlertError" class="auth-alert error" style="display: none;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="resetAlertErrorMsg">Error message</span>
        </div>
        <div id="resetAlertSuccess" class="auth-alert success" style="display: none;">
            <i class="fa-solid fa-circle-check"></i>
            <span>Password reset link sent! Check your inbox or spam folder.</span>
        </div>
        <form id="forgotPasswordForm" class="auth-form" novalidate>
            <div class="auth-form-group">
                <label for="resetEmail">Email Address</label>
                <div class="input-icon-wrap">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="resetEmail" placeholder="e.g. juandelacruz@gmail.com" required autocomplete="email">
                </div>
            </div>
            <button type="submit" id="sendResetBtn" class="auth-submit-btn">
                <i class="fa-solid fa-paper-plane"></i> Send Reset Link
            </button>
        </form>
        <div class="auth-footer-links">
            <a href="login.html" class="auth-back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</main>

<!-- SCRIPTS -->
<script type="module" src="js/forgetpassword.js"></script>

</body>
</html>
